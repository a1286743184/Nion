# jdk.tls.disabledAlgorithms：禁用 JDK 21+ 默认启用的后量子密钥交换（ML-KEM 系）。
# 这些算法的 ClientHello key share 体积过大，会被部分网络中间设备识别并重置 TLS 握手
# （表现为所有 JVM 发起的 HTTPS 一律 "Remote host terminated the handshake"，curl 不受影响）。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.tls.disabledAlgorithms=X25519MLKEM768,X25519DHMLKEM768,ML_KEM,MLKEM
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
